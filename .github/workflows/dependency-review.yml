name: Dependency review

# Blocks pull requests that add dependencies with known vulnerabilities
# (high severity or worse) or with licences incompatible with the project.
# Needs the dependency graph, which GitHub enables on every public repository.
# Private repositories without GitHub Advanced Security skip the job (a skipped
# required check does not block merging); it starts working once the repository is public.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0-only, GPL-3.0-only, AGPL-3.0-only, AGPL-3.0-or-later
          comment-summary-in-pr: on-failure
