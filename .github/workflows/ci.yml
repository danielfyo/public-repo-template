name: CI

# Repository-wide quality gates that every project created from the template keeps.
# Add one job per toolchain (build, lint, test, coverage summary) below the
# "Project jobs" marker and list its job id in scripts/setup-repo.ps1 so the
# "Protect main" ruleset requires it.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    name: markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0

  editorconfig:
    name: editorconfig
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: editorconfig-checker/action-editorconfig-checker@51f63319f592f97930c73d9c46184d20bd206393 # v3.0.0
      - run: editorconfig-checker

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  no-ai-traces:
    name: no-ai-traces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Repository content stays free of AI assistant references
        run: |
          if git grep -n -I -i -E 'claude|anthropic|co-authored-by: *(claude|copilot|chatgpt)' \
              -- . ':(exclude).gitignore' ':(exclude).github/workflows/ci.yml'; then
            echo "::error::Remove the AI assistant references listed above."
            exit 1
          fi

  # --- Project jobs ----------------------------------------------------------
  # Example for a Node.js project (pin every action to a full commit SHA):
  #
  # node:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #       with:
  #         persist-credentials: false
  #     - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
  #       with: { node-version: "22", cache: npm }
  #     - run: npm ci
  #     - run: npm run lint && npm run typecheck
  #     - run: npm test -- --coverage
  #     - run: npm run build
